services:
  db:
    image: postgres:16-alpine
    container_name: mindmap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mindmap}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mindmap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindmap-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 容器内通过 service 名访问
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mindmap}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "3000:3000"
    # 首次启动可解开下行以自动应用迁移：
    # command: sh -c "npx prisma migrate deploy && node server.js"

volumes:
  pgdata:
  redisdata:
